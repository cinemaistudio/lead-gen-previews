name: Windows 11 ARM64 RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - name: Verify Windows 11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Operating System: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($os.Caption -notlike '*Windows 11*') {
            throw "This runner is not Windows 11."
          }

      - name: Enable RDP and configure account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Add the RDP_PASSWORD repository secret first."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $account = Get-LocalUser `
            -Name 'runneradmin' -ErrorAction SilentlyContinue

          if ($account) {
            Set-LocalUser -Name 'runneradmin' -Password $securePassword
          } else {
            New-LocalUser `
              -Name 'runneradmin' `
              -Password $securePassword `
              -Description 'Temporary RDP account'
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'runneradmin' `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Set-NetFirewallRule `
            -DisplayGroup 'Remote Desktop' `
            -Enabled True -Profile Any

          # Restrict RDP firewall access to Tailscale IPv4 addresses.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' |
            Get-NetFirewallAddressFilter |
            Set-NetFirewallAddressFilter -RemoteAddress '100.64.0.0/10'

          Write-Host "RDP configured for user: runneradmin"
          Write-Host "Password is stored in GitHub Secrets."

      - name: Install and connect Tailscale (browser auth link)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($process.ExitCode)."
          }

          $paths = @(
            'C:\Program Files\Tailscale\tailscale.exe',
            'C:\Program Files (x86)\Tailscale\tailscale.exe'
          )

          $tailscaleExe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $tailscaleExe) {
            throw "Could not locate tailscale.exe."
          }

          # Start interactive login in the background so we can capture the auth URL.
          $logFile = Join-Path $env:TEMP 'tailscale-up.log'
          if (Test-Path $logFile) { Remove-Item $logFile -Force }

          $upProc = Start-Process `
            -FilePath $tailscaleExe `
            -ArgumentList @('up', '--accept-routes', '--unattended') `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $logFile `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WAITING FOR TAILSCALE AUTH LINK"
          Write-Host "========================================"
          Write-Host "Open the URL below in your browser and sign in."
          Write-Host "This job will wait until authentication succeeds."
          Write-Host "========================================"
          Write-Host ""

          $authUrl = $null
          $deadline = (Get-Date).AddMinutes(15)

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2

            if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
              if ($content -match 'https://login\.tailscale\.com/a/[A-Za-z0-9]+') {
                $authUrl = $Matches[0]
                break
              }
            }

            # Also try status JSON in case the URL appears there first.
            try {
              $statusJson = & $tailscaleExe status --json 2>$null | Out-String
              if ($statusJson -match '"AuthURL"\s*:\s*"(https://[^"]+)"') {
                $authUrl = $Matches[1]
                if ($authUrl) { break }
              }
            } catch {}
          }

          if (-not $authUrl) {
            Write-Host "--- tailscale up log ---"
            if (Test-Path $logFile) { Get-Content $logFile }
            throw "Timed out waiting for Tailscale auth URL (15 minutes)."
          }

          Write-Host ""
          Write-Host "########################################"
          Write-Host " OPEN THIS LINK TO AUTHENTICATE:"
          Write-Host " $authUrl"
          Write-Host "########################################"
          Write-Host ""

          # Wait until the node is actually logged in / has a Tailscale IP.
          $connected = $false
          $waitDeadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $waitDeadline) {
            Start-Sleep -Seconds 5

            try {
              $ip = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()
              if ($ip -and $ip -match '^100\.') {
                $connected = $true
                break
              }
            } catch {}

            # Re-print the URL periodically in case the user missed it.
            Write-Host "Still waiting for auth... open: $authUrl"
          }

          if (-not $connected) {
            Write-Host "--- tailscale up log ---"
            if (Test-Path $logFile) { Get-Content $logFile }
            throw "Timed out waiting for Tailscale authentication (20 minutes)."
          }

          # Give the up process a moment; it should exit once authenticated.
          if (-not $upProc.HasExited) {
            try { $upProc.WaitForExit(30000) } catch {}
          }

          $ip = (& $tailscaleExe ip -4 | Select-Object -First 1).Trim()
          if (-not $ip) {
            throw "Could not obtain the Tailscale IPv4 address after auth."
          }

          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS 11 RDP READY"
          Write-Host "========================================"
          Write-Host "OS       : $($os.Caption)"
          Write-Host "Version  : $($os.Version)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "RDP IP   : $ip"
          Write-Host "Username : runneradmin"
          Write-Host "Password : Your RDP_PASSWORD secret"
          Write-Host "Network  : Tailscale"
          Write-Host "========================================"

      - name: Keep runner active
        shell: pwsh
        run: |
          $totalMinutes = 350
          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 10 -eq 0) {
              Write-Host "RDP runner active: $i / $totalMinutes minutes"
            }
          }
