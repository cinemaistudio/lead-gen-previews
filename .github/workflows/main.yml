name: Windows 11 ARM64 RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - name: Verify Windows 11
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Operating System: $($os.Caption)"
          Write-Host "Version: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($os.Caption -notlike '*Windows 11*') {
            throw "This runner is not Windows 11."
          }

      - name: Enable RDP and configure account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = 'MR.English2008'
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $account = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue
          if ($account) {
            Set-LocalUser -Name 'runneradmin' -Password $securePassword
          } else {
            New-LocalUser `
              -Name 'runneradmin' `
              -Password $securePassword `
              -Description 'Temporary RDP account'
          }
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'runneradmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member 'runneradmin' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          Set-NetFirewallRule -DisplayGroup 'Remote Desktop' -Enabled True -Profile Any
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' |
            Get-NetFirewallAddressFilter |
            Set-NetFirewallAddressFilter -RemoteAddress '100.64.0.0/10'
          Write-Host "RDP configured for user: runneradmin"
          Write-Host "Password: MR.English2008"

      - name: Install and connect Tailscale (browser auth)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Install Tailscale ---
          $installer = Join-Path $env:TEMP 'tailscale-setup.exe'
          Write-Host "Downloading Tailscale installer..."
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile $installer -UseBasicParsing

          Write-Host "Installing Tailscale..."
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Tailscale installation failed with exit code $($process.ExitCode)."
          }

          $paths = @(
            'C:\Program Files\Tailscale\tailscale.exe',
            'C:\Program Files (x86)\Tailscale\tailscale.exe'
          )
          $tailscaleExe = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tailscaleExe) {
            throw "Could not locate tailscale.exe after installation."
          }
          Write-Host "Using: $tailscaleExe"

          # --- Start tailscale up (unattended + accept routes) ---
          Write-Host "Starting tailscale up..."
          $upProc = Start-Process `
            -FilePath $tailscaleExe `
            -ArgumentList @('up', '--accept-routes', '--unattended') `
            -PassThru `
            -NoNewWindow

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WAITING FOR TAILSCALE AUTH LINK"
          Write-Host "========================================"
          Write-Host "Open the URL below in your browser and sign in."
          Write-Host "This job will wait until authentication succeeds."
          Write-Host "========================================"
          Write-Host ""

          $authUrl = $null
          $deadline = (Get-Date).AddMinutes(15)

          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3

            try {
              $statusJson = & $tailscaleExe status --json 2>$null | Out-String
              if ($statusJson -match '"AuthURL"\s*:\s*"(https://[^"]+)"') {
                $authUrl = $Matches[1]
                break
              }
            } catch {
              # status may not be ready yet
            }
          }

          if (-not $authUrl) {
            Write-Host "Could not obtain AuthURL. Dumping status:"
            & $tailscaleExe status 2>&1 | Out-Host
            throw "Timed out waiting for Tailscale auth URL (15 minutes)."
          }

          Write-Host ""
          Write-Host "########################################"
          Write-Host " OPEN THIS LINK TO AUTHENTICATE:"
          Write-Host " $authUrl"
          Write-Host "########################################"
          Write-Host ""

          # --- Wait until we have a 100.x Tailscale IP ---
          $connected = $false
          $waitDeadline = (Get-Date).AddMinutes(20)

          while ((Get-Date) -lt $waitDeadline) {
            Start-Sleep -Seconds 5

            try {
              $ip = (& $tailscaleExe ip -4 2>$null | Select-Object -First 1).Trim()
              if ($ip -and $ip -match '^100\.') {
                $connected = $true
                break
              }
            } catch {}

            Write-Host "Still waiting for auth... open: $authUrl"
          }

          if (-not $connected) {
            Write-Host "Final status:"
            & $tailscaleExe status 2>&1 | Out-Host
            throw "Timed out waiting for Tailscale authentication (20 minutes)."
          }

          # Give the up process a moment to settle
          if (-not $upProc.HasExited) {
            try { $upProc.WaitForExit(10000) } catch {}
          }

          $ip = (& $tailscaleExe ip -4 | Select-Object -First 1).Trim()
          if (-not $ip -or $ip -notmatch '^100\.') {
            throw "Could not obtain a valid Tailscale IPv4 address after auth."
          }

          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host ""
          Write-Host "========================================"
          Write-Host " WINDOWS 11 RDP READY"
          Write-Host "========================================"
          Write-Host "OS          : $($os.Caption)"
          Write-Host "Version     : $($os.Version)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "RDP IP      : $ip"
          Write-Host "Username    : runneradmin"
          Write-Host "Password    : MR.English2008"
          Write-Host "Network     : Tailscale"
          Write-Host "========================================"

          # Explicitly succeed so the step never fails after printing the credentials
          $global:LASTEXITCODE = 0
          exit 0

      - name: Minimize annoying console windows
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5

          # Kill WSL update prompts
          taskkill /F /IM wsl.exe /T 2>$null | Out-Null
          try { wsl --shutdown 2>$null } catch {}

          $code = @'
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Win32 {
              [DllImport("user32.dll")]
              public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")]
              public static extern bool EnumWindows(EnumWindowsProc enumProc, IntPtr lParam);
              public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int GetWindowText(IntPtr hWnd, System.Text.StringBuilder lpString, int nMaxCount);
          }
"@
          $callback = {
              param($hWnd, $lParam)
              $sb = New-Object System.Text.StringBuilder 256
              [Win32]::GetWindowText($hWnd, $sb, $sb.Capacity) | Out-Null
              $title = $sb.ToString()
              if ($title -match "HostedComputeAgent|hosted-compute-agent|wsl|WSL|C:\\Windows\\system32\\wsl") {
                  [Win32]::ShowWindow($hWnd, 6) | Out-Null   # 6 = SW_MINIMIZE
              }
              return $true
          }
          [Win32]::EnumWindows($callback, [IntPtr]::Zero)
'@

          # Run the minimizer several times because the agent keeps creating windows
          1..10 | ForEach-Object {
            powershell -NoProfile -Command $code 2>$null
            Start-Sleep -Seconds 6
          }

          Write-Host "Annoying console windows minimized."

      - name: Keep runner active
        shell: pwsh
        run: |
          $totalMinutes = 350
          for ($i = 1; $i -le $totalMinutes; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 10 -eq 0) {
              Write-Host "RDP runner active: $i / $totalMinutes minutes"
            }
          }
